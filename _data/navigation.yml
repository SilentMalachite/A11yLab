# グローバルナビゲーションの項目と並び順。
#
# セクションの正式名称はここに持たない。各セクションの index.html の
# title: が唯一の出どころで、<title> と <h1>、記事末尾の戻り先リンクの
# 文言はすべてそこから引く。同じ名前を二重に持つと片方だけ直したときに
# 「ナビでは聴覚、遷移先の見出しは別の名前」という食い違いが起きる。
# 現在地を名前の一致で追っている利用者には、これだけで目的地に着いたか
# どうかが判断できなくなる (WCAG 2.4.6 / 3.2.3)。
#
# ラベルを短くしているのは、音声操作の利用者が発話しやすくするため。
# 表示ラベルとアクセシブルネームは一致させる (WCAG 2.5.3)。
#
# key は _config.yml の collections 名と一致させること。記事ページから
# 所属セクションを引くのにこの値を使う。

- key: visual
  label: 視覚
  url: /visual/

- key: hearing
  label: 聴覚
  url: /hearing/

- key: physical
  label: 身体
  url: /physical/
