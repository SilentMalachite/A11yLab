title: A11yLab
email: "silentmalachite@gmail.com"
description: "アクセシビリティ探求室"
baseurl: "/A11yLab"
url: "https://SilentMalachite.github.io"
markdown: kramdown
theme_mode: auto # custom

# ファイル名や front matter の日付を JST として解釈する。
# 未指定だとビルド環境のタイムゾーン(GitHub は UTC)基準になり、
# 日本時間の夜にその日の日付で記事を追加すると UTC ではまだ未来の
# 扱いになる。Jekyll は既定が future: false のため記事が出力されず、
# 一覧にリンクだけ出て本体が 404 になる。
timezone: Asia/Tokyo

collections:
  visual:
    output: true
    permalink: /:collection/:name/
  hearing:
    output: true
    permalink: /:collection/:name/
  physical:
    output: true
    permalink: /:collection/:name/

# Build settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

sass:
  style: compressed
